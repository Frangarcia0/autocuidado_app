name: autocuidado_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  flutter_local_notifications: 17.2.4
  flutter_timezone: ^5.0.0
  timezone: ^0.9.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/eira_isotype.png"
  adaptive_icon_background: "#A3B18A"
  adaptive_icon_foreground: "assets/branding/eira_isotype.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/content/
